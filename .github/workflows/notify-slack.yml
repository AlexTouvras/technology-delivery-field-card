name: Notify Slack approve

# Posts #orbit Approve/Skip for a field-card PR (Orbit webhook + signed links).
# Called after Cursor finishes the HTML pass, or manually.
# Push on chore/weekly-refresh-* also notifies when data/judgment.md changes —
# Cursor Automation can push that branch but cannot workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
  push:
    branches:
      - "chore/weekly-refresh-*"
    paths:
      - "data/judgment.md"
      - ".github/workflows/notify-slack.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUM=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            echo "No open PR for ${{ github.ref_name }}; opening from data/judgment.md"
            test -f data/judgment.md
            BODY=$(mktemp)
            {
              cat data/judgment.md
              echo
              echo "### Before merge"
              echo "- [x] Cursor Automation applied judgment (\`## Summary\` present)"
              echo "- [ ] Slack **Open card preview** reviewed"
              echo "- [ ] Slack Approve used (do not merge from the agent chat)"
              echo "- [x] Decision table unchanged unless a new *job* appeared"
            } > "$BODY"
            URL=$(gh pr create --repo "${{ github.repository }}" --base main --head "${{ github.ref_name }}" \
              --title "chore: weekly field card discovery + refresh" --body-file "$BODY")
            NUM=$(echo "$URL" | grep -oE '[0-9]+$')
            if [ -z "$NUM" ]; then
              echo "Failed to create weekly PR"
              exit 1
            fi
            echo "Created PR #$NUM ($URL)"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
      - name: Notify #orbit
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          SLACK_ORBIT_WEBHOOK_URL: ${{ secrets.SLACK_ORBIT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEEKLY_WRITE_SECRET: ${{ secrets.WEEKLY_WRITE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIELD_CARD_ACTION_SECRET: ${{ secrets.FIELD_CARD_ACTION_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://alextouvras.com' }}
        run: node scripts/notify-slack.mjs
