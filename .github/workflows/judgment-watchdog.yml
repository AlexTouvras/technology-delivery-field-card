name: Judgment watchdog

# Fail-closed visibility when Friday Cursor Automation misses judgment / Slack Approve.
# Sat: warn in #orbit. Mon: warn again and fail the job so Actions stays red.

on:
  schedule:
    # Saturday 06:00 UTC ≈ 09:00 EEST — after Friday 17:00 judgment window
    - cron: "0 6 * * 6"
    # Monday 06:00 UTC ≈ 09:00 EEST — escalate before the week starts stale
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      fail_on_missed:
        description: Exit 1 when a stuck discovery PR is found
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check open weekly PRs for missing judgment
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_ORBIT_WEBHOOK_URL: ${{ secrets.SLACK_ORBIT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEEKLY_WRITE_SECRET: ${{ secrets.WEEKLY_WRITE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIELD_CARD_ACTION_SECRET: ${{ secrets.FIELD_CARD_ACTION_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://alextouvras.com' }}
          MANUAL_FAIL: ${{ inputs.fail_on_missed }}
        run: |
          set -euo pipefail
          DOW=$(date -u +%u) # 1=Monday … 6=Saturday
          if [ "${MANUAL_FAIL:-}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" = "1" ]; }; then
            export WATCH_FAIL_ON_MISSED=1
          else
            export WATCH_FAIL_ON_MISSED=0
          fi
          echo "WATCH_FAIL_ON_MISSED=$WATCH_FAIL_ON_MISSED (dow=$DOW event=${{ github.event_name }})"
          node scripts/watch-judgment.mjs
