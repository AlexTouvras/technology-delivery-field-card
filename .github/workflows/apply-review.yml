name: Apply review

# Reviewer (Cursor Automation) publishes or keeps the previous card.
# Hits Orbit /api/field-card/action — same merge + site sync as Slack Approve/Decline.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      decision:
        description: approve publishes; decline keeps the live card
        required: true
        type: choice
        options:
          - approve
          - decline
      note:
        description: One-sentence reason (optional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply review via Orbit
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
          WEEKLY_WRITE_SECRET: ${{ secrets.WEEKLY_WRITE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIELD_CARD_ACTION_SECRET: ${{ secrets.FIELD_CARD_ACTION_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://alextouvras.com' }}
        run: node scripts/apply-review.mjs
