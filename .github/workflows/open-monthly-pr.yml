name: Open monthly judgment PR

# One-shot: the Cursor app token can push this branch but cannot create pulls.
# Actions GITHUB_TOKEN already opens field-card PRs (see weekly-refresh.yml).
on:
  push:
    branches:
      - chore/monthly-refresh-2026-10

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or update the monthly PR from data/judgment.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head chore/monthly-refresh-2026-10 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore: monthly field card judgment 2026-10" --body-file data/judgment.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create --base main --head chore/monthly-refresh-2026-10 --title "chore: monthly field card judgment 2026-10" --body-file data/judgment.md
          fi
